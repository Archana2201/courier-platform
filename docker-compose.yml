services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier
    volumes:
      - ./database/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier"]
      interval: 5s
      retries: 10

  pricing:
    build: { context: ., dockerfile: Dockerfile.service, args: { PROJECT: Courier.Pricing } }
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=pricing_db;Username=courier;Password=courier"
    depends_on: { postgres: { condition: service_healthy } }

  shipments:
    build: { context: ., dockerfile: Dockerfile.service, args: { PROJECT: Courier.Shipments } }
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=shipments_db;Username=courier;Password=courier"
      Services__Pricing: "http://pricing:8080/"
      EventBus__Subscribers__0: "http://tracking:8080/api/events"
    depends_on: { postgres: { condition: service_healthy }, pricing: { condition: service_started } }

  tracking:
    build: { context: ., dockerfile: Dockerfile.service, args: { PROJECT: Courier.Tracking } }
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=tracking_db;Username=courier;Password=courier"
    depends_on: { postgres: { condition: service_healthy } }

  gateway:
    build: { context: ., dockerfile: Dockerfile.service, args: { PROJECT: Courier.Gateway } }
    environment:
      ReverseProxy__Clusters__shipments__Destinations__d1__Address: "http://shipments:8080/"
      ReverseProxy__Clusters__pricing__Destinations__d1__Address: "http://pricing:8080/"
      ReverseProxy__Clusters__tracking__Destinations__d1__Address: "http://tracking:8080/"
    ports: ["5100:8080"]
    depends_on: [shipments, pricing, tracking]

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [gateway]

volumes:
  pgdata:
