name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and test
        run: |
          set +e
          dotnet test backend/tests/Courier.Tests/Courier.Tests.csproj --verbosity normal 2>&1 | tee dotnet.log
          status=${PIPESTATUS[0]}
          # Surface compiler/test failures as annotations so they are visible without opening the raw log.
          grep -E ": error |^\s+Failed |Assert\.|Error Message" dotnet.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          exit $status
      - run: dotnet build backend/src/Courier.Gateway/Courier.Gateway.csproj -c Release
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
